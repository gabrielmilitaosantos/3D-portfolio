<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Mona+Sans:ital,wght@0,200..900;1,200..900&display=swap"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />

    <title>Gabriel Militão - Portfolio</title>
    <meta
      name="description"
      content="Portfólio de Gabriel Militão, desenvolvedor full-stack com TypeScript, React e Node.js. Veja projetos em produção, trajetória e tecnologias."
    />

    <!-- %VITE_SITE_URL% is replaced by Vite at build time.
         Define it in .env.local and in the Vercel environment variables. -->
    <link rel="canonical" href="%VITE_SITE_URL%" />

    <!-- Open Graph: the preview shown by LinkedIn, WhatsApp and others. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Gabriel Militão" />
    <meta property="og:locale" content="pt-BR" />
    <meta property="og:url" content="%VITE_SITE_URL%" />
    <meta
      property="og:title"
      content="Gabriel Militão - Desenvolvedor Full-Stack"
    />
    <meta
      property="og:description"
      content="Portfólio de Gabriel Militão, desenvolvedor full-stack com TypeScript, React e Node.js. Veja projetos em produção, trajetória e tecnologias."
    />
    <meta property="og:image" content="%VITE_SITE_URL%/images/og-image.jpg" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="600" />
    <meta
      property="og:image:alt"
      content="Portfolio de Gabriel Militão, desenvolvedor full-stack"
    />
    <meta property="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
